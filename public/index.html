<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>trading-bot-jev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bar">
      <div>
        <h1>trading-bot-jev</h1>
        <p id="feed" class="feed"></p>
      </div>
      <div class="controls">
        <div id="speed" class="segmented" role="group" aria-label="Vitesse de décision du bot"></div>
        <button id="reset">Recommencer</button>
      </div>
    </header>
    <p id="status" role="status" class="status" hidden></p>

    <main>
      <section class="portfolio panel" aria-labelledby="portfolio-title">
        <div class="summary">
          <h2 id="portfolio-title">Portefeuille</h2>
          <p id="equity" class="hero">–</p>
          <p id="pnl" class="delta"></p>
          <dl id="holdings"></dl>
          <p id="stats" class="muted"></p>
        </div>
        <figure>
          <figcaption>Valeur du portefeuille en USDT, vert au-dessus du capital de départ, rouge en dessous</figcaption>
          <div id="equityChart" class="chart"></div>
        </figure>
      </section>

      <div class="toolbar">
        <div id="intervals" class="segmented" role="group" aria-label="Durée d'une bougie"></div>
        <p class="muted">▲ achat du bot, ▼ vente du bot</p>
      </div>
      <section id="markets" class="markets" aria-label="Cours en direct"></section>

      <section class="panel" aria-labelledby="trades-title">
        <h2 id="trades-title">Ordres du bot</h2>
        <div id="trades" class="scroll"></div>
      </section>

      <section class="panel" aria-labelledby="news-title">
        <h2 id="news-title">Titres jugés par Jev</h2>
        <p class="muted">
          Jev lit chaque nouveau titre dès sa parution. Le biais news de chaque actif est la moyenne des sentiments,
          pondérée par l'impact marché, la confiance du modèle et la fraîcheur du titre.
        </p>
        <div id="news" class="scroll"></div>
      </section>
    </main>

    <script src="vendor/charts.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
